[project]
name = "rag-system"
version = "0.1.0"
description = "A RAG system built from scratch — Docling, PostgreSQL, Qdrant, Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.0",
    "certifi>=2026.1.4",
    "docling>=1.0.0",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "mlflow>=2.8.0",
    "ollama>=0.1.0",
    "passlib>=1.7.4",
    "pydantic>=2.5.0",
    "pymysql>=1.1.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "sentence-transformers>=2.2.0",
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel==0.0.18",
    "uvicorn[standard]>=0.24.0",
    "zenml[server]>=0.50.0",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
    "langchain-text-splitters>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.11.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "black>=23.11.0",
    "isort",
    "mypy>=1.7.0",
    "pre-commit",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.6",
]


# ──────────────────────────────────────────────
# PYTEST — This is the fix for ModuleNotFoundError
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require external services (DB, Qdrant, Ollama)",
    "e2e: end-to-end pipeline tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
